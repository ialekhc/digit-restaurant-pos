services:
  postgres:
    image: postgres:16-alpine
    container_name: digit-pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_pos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_pos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./server
    container_name: backend
    ports:
      - "5500:5500"
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/restaurant_pos
      DATABASE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./client
    container_name: frontend
    ports:
      - "127.0.0.1:3005:80"    
    env_file:
      - ./client/.env
    depends_on:
      - backend

volumes:
  postgres_data:
