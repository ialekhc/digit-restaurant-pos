services:
  postgres:
    image: postgres:16-alpine
    container_name: digit-pos-postgres
    restart: unless-stopped

    ports:
      - "127.0.0.1:5432:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_pos}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_pos"]
      interval: 5s
      timeout: 5s
      retries: 20

    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: backend
    restart: unless-stopped

    ports:
      - "127.0.0.1:5500:5500"

    env_file:
      - ./server/.env

    environment:
      PORT: "5500"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-restaurant_pos}
      CORE_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-restaurant_pos}
      DATABASE_SSL: "false"
      UPLOAD_DIR: /app/data/uploads

    volumes:
      - uploads_data:/app/data/uploads

    depends_on:
      postgres:
        condition: service_healthy

    init: true

    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:3005:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  uploads_data:
