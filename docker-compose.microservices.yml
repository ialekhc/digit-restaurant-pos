services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurant-pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_pos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_pos"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-service:
    build:
      context: ./server
    container_name: restaurant-pos-core-service
    restart: unless-stopped
    environment:
      PORT: 5500
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/restaurant_pos
      DATABASE_SSL: "false"
      JWT_SECRET: supersecretkey
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5400
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5500:5500"

  vendor-service:
    build:
      context: .
      dockerfile: ./services/vendor-service/Dockerfile
    container_name: restaurant-pos-vendor-service
    restart: unless-stopped
    environment:
      PORT: 5601
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/restaurant_pos
      DATABASE_SSL: "false"
      JWT_SECRET: supersecretkey
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5601:5601"

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: restaurant-pos-api-gateway
    restart: unless-stopped
    environment:
      PORT: 8080
      CORE_SERVICE_URL: http://core-service:5500
      VENDOR_SERVICE_URL: http://vendor-service:5601
    depends_on:
      - core-service
      - vendor-service
    ports:
      - "8080:8080"

volumes:
  postgres_data:
