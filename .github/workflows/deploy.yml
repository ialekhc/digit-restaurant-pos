name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: digit-restaurant-pos-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 20m
          script: |
            set -Eeuo pipefail

            cd /home/alekh/digit-restaurant-pos

            echo "Connected as: $(whoami)"
            echo "Deploying from: $(pwd)"

            test -x ./deploy.sh || {
              echo "deploy.sh is missing or not executable"
              exit 1
            }

            ./deploy.sh