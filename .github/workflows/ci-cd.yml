name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
            services/api-gateway/package-lock.json
            services/vendor-service/package-lock.json

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build:client

      - name: Syntax Check Backend Services
        run: |
          node --check server/server.js
          node --check server/src/app.js
          node --check services/api-gateway/src/server.js
          node --check services/vendor-service/src/server.js

  deploy_backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.RENDER_DEPLOY_HOOK_URL != ''
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail-with-body --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

  deploy_frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != ''
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_API_URL: ${{ secrets.VITE_API_URL_PROD }}
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with Vercel
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "VITE_API_URL_PROD secret is empty. Set it to your API base URL before deploying."
            exit 1
          fi
          VITE_API_URL="$VITE_API_URL" vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel Production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

